<form [formGroup]="guestForm">
  <div>
    <label for="name">guest name</label>
    <input type="text" name="name" id="name" formControlName="name">
  </div>
  <div>
    <label for="check-in-time">check-in time</label>
    <input type="datetime" name="check-in-time" id="check-in-time" formControlName="time">
  </div>
  <div>
    <label for="description">description</label>
    <input type="text" name="description" id="description" formControlName="description">
  </div>
  <div>
    <label for="notes">notes</label>
    <input type="text" name="notes" id="notes" formControlName="notes">
  </div>
</form>
